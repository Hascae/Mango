## Project-wide Gradle settings.
#
# For more details on how to configure your build environment visit
# http://www.gradle.org/docs/current/userguide/build_environment.html
#
# Specifies the JVM arguments used for the daemon process.
# The setting is particularly useful for tweaking memory settings.
# Default value: -Xmx10248m -XX:MaxPermSize=256m
# org.gradle.jvmargs=-Xmx2048m -XX:MaxPermSize=512m -XX:+HeapDumpOnOutOfMemoryError -Dfile.encoding=UTF-8
#
# When configured, Gradle will run in incubating parallel mode.
# This option should only be used with decoupled projects. More details, visit
# http://www.gradle.org/docs/current/userguide/multi_project_builds.html#sec:decoupled_projects
# org.gradle.parallel=true
#Sat Mar 12 05:53:50 MSK 2016
APP_VERSION_CODE=7010
APP_VERSION_NAME=5.0.0
APP_PACKAGE=r.xs.rp
IS_PRIVATE=false
RELEASE_KEY_PASSWORD=android
RELEASE_KEY_ALIAS=androidkey
RELEASE_STORE_PASSWORD=android
org.gradle.jvmargs=-Xmx8g -XX:MaxMetaspaceSize=1g
org.gradle.daemon=true
org.gradle.parallel=true
org.gradle.configureondemand=false
android.useAndroidX=true
android.nonTransitiveRClass=false
android.enableR8.fullMode=true
# Compose preview screenshots, rendered by AGP test suites in TMessagesProj_Skin.
android.experimental.enableScreenshotTest=true
android.experimental.testSuiteSupport=true
android.r8.optimizedResourceShrinking=true
android.enableResourceOptimizations=true
org.gradle.tooling.parallel=true
# The media3 modules come from official's submodule and apply the Kotlin plugin themselves,
# the pre-AGP 9 way; AGP 9's built-in Kotlin and old DSL are turned off so they build as is.
# Modules with Kotlin sources apply org.jetbrains.kotlin.android explicitly.
android.builtInKotlin=false
android.newDsl=false
