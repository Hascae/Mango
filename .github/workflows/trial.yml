name: Trial build

# A signed arm64 APK for personal testing, started by pushing a trial-* tag.
# The APK carries the private API credentials, so it is encrypted before it
# is stored, and the artifact is kept for one day only.
on:
  push:
    tags: ['trial-*']

permissions:
  contents: read

concurrency:
  group: trial-build
  cancel-in-progress: true

jobs:
  apk:
    runs-on: ubuntu-latest
    timeout-minutes: 180
    steps:
      - name: Free disk space
        run: |
          sudo rm -rf /usr/share/dotnet /opt/ghc /usr/local/share/boost /opt/hostedtoolcache/CodeQL /usr/local/lib/android/sdk/ndk
          df -h /

      # Official 13.x builds its native code from git submodules.
      - uses: actions/checkout@v4
        with:
          submodules: recursive

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - uses: gradle/actions/setup-gradle@v4

      - name: Install the Android SDK packages the build pins
        run: |
          sdkmanager="$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager"
          yes | "$sdkmanager" --licenses > /dev/null
          "$sdkmanager" "platforms;android-37.0" "build-tools;37.0.0" "ndk;30.0.16248370" "cmake;4.1.2" > /dev/null

      - name: Put the signing key, the API credentials and a placeholder services file in place
        env:
          TG_API_ID: ${{ secrets.TG_API_ID }}
          TG_API_HASH: ${{ secrets.TG_API_HASH }}
          SIGNING_KEYSTORE_B64: ${{ secrets.SIGNING_KEYSTORE_B64 }}
        run: |
          set -euo pipefail
          printf '%s' "$SIGNING_KEYSTORE_B64" | base64 -d > TMessagesProj/config/release.keystore
          vars=TMessagesProj/src/main/java/org/telegram/messenger/BuildVars.java
          sed -i -E "s/(public static int APP_ID = )[0-9]+;/\1${TG_API_ID};/" "$vars"
          sed -i -E "s/(public static String APP_HASH = \")[0-9a-f]*(\";)/\1${TG_API_HASH}\2/" "$vars"
          grep -q "APP_ID = ${TG_API_ID};" "$vars"
          grep -q "APP_HASH = \"${TG_API_HASH}\";" "$vars"
          # No push in trial builds: the services plugin only needs a client for the package.
          cat > TMessagesProj_App/google-services.json <<'JSON'
          {
            "project_info": {
              "project_number": "100000000000",
              "project_id": "jiqing-trial",
              "storage_bucket": "jiqing-trial.appspot.com"
            },
            "client": [
              {
                "client_info": {
                  "mobilesdk_app_id": "1:100000000000:android:a1b2c3d4e5f60718",
                  "android_client_info": { "package_name": "r.xs.rp" }
                },
                "oauth_client": [],
                "api_key": [ { "current_key": "AIzaSyA-trial-placeholder-not-a-real-key" } ],
                "services": { "appinvite_service": { "other_platform_oauth_client": [] } }
              }
            ],
            "configuration_version": "1"
          }
          JSON

      - name: Build
        env:
          SIGNING_PASSWORD: ${{ secrets.SIGNING_PASSWORD }}
        run: |
          bash ./gradlew --no-daemon --console=plain :TMessagesProj_App:assembleAfatRelease \
            -Pandroid.injected.build.abi=arm64-v8a \
            -Pandroid.injected.testOnly=false \
            -Pandroid.injected.signing.store.file="$GITHUB_WORKSPACE/TMessagesProj/config/release.keystore" \
            -Pandroid.injected.signing.store.password="$SIGNING_PASSWORD" \
            -Pandroid.injected.signing.key.alias=rxsrp \
            -Pandroid.injected.signing.key.password="$SIGNING_PASSWORD" \
            -PRELEASE_STORE_PASSWORD="$SIGNING_PASSWORD" \
            -PRELEASE_KEY_ALIAS=rxsrp \
            -PRELEASE_KEY_PASSWORD="$SIGNING_PASSWORD"

      - name: Check and encrypt the APK
        env:
          ARTIFACT_PASSWORD: ${{ secrets.ARTIFACT_PASSWORD }}
        run: |
          set -euo pipefail
          apk=$(find TMessagesProj_App/build -name '*afat-release*.apk' | head -n 1)
          tools="$ANDROID_HOME/build-tools/37.0.0"
          "$tools/aapt2" dump badging "$apk" | grep '^package:'
          "$tools/aapt2" dump xmltree --file AndroidManifest.xml "$apk" | grep -i testOnly || echo "testOnly: not set"
          "$tools/apksigner" verify --print-certs "$apk" | grep 'SHA-256 digest' | head -n 1
          ls -l "$apk"
          sha256sum "$apk"
          mkdir -p out
          openssl enc -aes-256-cbc -pbkdf2 -iter 200000 -salt -in "$apk" -out out/jiqing.apk.enc -pass env:ARTIFACT_PASSWORD

      - uses: actions/upload-artifact@v4
        with:
          name: jiqing-trial
          path: out/jiqing.apk.enc
          retention-days: 1
          compression-level: 0

      - name: Remove the signing key
        if: always()
        run: rm -f TMessagesProj/config/release.keystore
